<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: white;
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 450px;
      text-align: center;
    }
    .badge {
      display: inline-block;
      background: #e8f5e9;
      color: #2e7d32;
      padding: 0.3rem 0.9rem;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }
    h2 { color: #1a1a2e; margin-bottom: 0.75rem; }
    p { color: #666; margin-bottom: 1.5rem; }
    a {
      display: inline-block;
      padding: 0.7rem 1.5rem;
      background: transparent;
      border: 2px solid #4f46e5;
      color: #4f46e5;
      border-radius: 8px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s;
    }
    a:hover { background: #4f46e5; color: white; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">🔒 Área protegida</div>
    <h2>Panel de Administración</h2>
    <p>Accediste correctamente. Tu sesión está activa.</p>
    <a href="/logout">Cerrar sesión</a>
  </div>
</body>
</html>
